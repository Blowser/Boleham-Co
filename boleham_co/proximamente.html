<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximamente - Boleham & Co</title>

  <link rel="stylesheet" href="assets/css/estilo.css">

  <style>
    .proximamente-contenedor {
      text-align: center;
      padding: 80px 20px;
      animation: fadeIn 0.8s ease forwards;
    }

    .proximamente-contenedor h1 {
      font-size: 3rem;
      color: var(--color-secundario);
      text-shadow: 2px 2px 10px var(--sombra-suave);
      margin-bottom: 20px;
    }

    .proximamente-contenedor p {
      font-size: 1.3rem;
      color: var(--color-principal);
      margin-bottom: 40px;
    }

    .btn-volver-inicio {
      background: var(--color-tarjeta);
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .btn-volver-inicio:hover {
      background: var(--color-secundario);
      color: white;
      transform: translateY(-3px);
    }
  </style>
</head>

<body>

  <div class="proximamente-contenedor">
    <h1>✨ Próximamente ✨</h1>
    <p>Estamos trabajando en esta sección para traerte más magia de Boleham & Co.</p>

    <a href="index.html" class="btn-volver-inicio">⬅ Volver al inicio</a>
  </div>

</body>
</html>
