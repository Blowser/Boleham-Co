<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximamente - Boleham & Co</title>

  <link rel="stylesheet" href="assets/css/estilo.css">

  <style>
    .proximamente-contenedor {
      text-align: center;
      padding: 80px 20px;
      animation: fadeIn 0.8s ease forwards;
    }

    .proximamente-contenedor h1 {
      font-size: 3rem;
      color: var(--color-secundario);
      text-shadow: 2px 2px 10px var(--sombra-suave);
      margin-bottom: 20px;
    }

    .proximamente-contenedor p {
      font-size: 1.3rem;
      color: var(--color-principal);
      margin-bottom: 40px;
    }

    .img-proximamente {
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      box-shadow: 0 4px 12px var(--sombra-suave);
      margin: 30px auto;
      display: block;
      animation: aparecer 1.5s ease forwards;
    }

    /* solo para este botón en esta página */
    .btn-volver {
      text-decoration: none;
    }

    /* aseguramos que el botón animado se comporte como bloque */
    .boton-animado {
      display: inline-block;
    }
  </style>
</head>

<body>

  <div class="proximamente-contenedor">
    <h1>✨ Próximamente ✨</h1>
    <p>Estamos trabajando en esta sección para traerte más magia de Boleham & Co.</p>

    <img src="assets/img/branding/boleham_co_proximamente.jpg" 
         alt="Página en construcción Boleham & Co" 
         class="img-proximamente">

    <a href="index.html" class="btn-volver boton-animado">
      ⬅ Volver al inicio
    </a>
  </div>

</body>
</html>
