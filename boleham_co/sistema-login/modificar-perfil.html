<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modificar perfil - Boleham & Co</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="../assets/css/estilo.css">
</head>

<body>

  <!-- HEADER -->
  <header id="header-principal">
    <div class="header-contenedor">

      <a href="../index.html">
        <img src="../assets/img/branding/boleham_co_logo.png" 
             alt="Boleham & Co" 
             class="logo-boleham-co">
      </a>

      <h1 class="titulo-principal">Modificar perfil</h1>
    </div>
  </header>

  <!-- FORMULARIO -->
  <section class="container mt-5 mb-5">
    <form id="form-modificar" 
          class="p-4 rounded shadow"
          style="background: var(--color-tarjeta);">

      <h2 class="text-center mb-4 titulo-articulo">Actualiza tus datos ✨</h2>

      <!-- NOMBRE -->
      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input type="text" id="mod-nombre" class="form-control">
        <div class="invalid-feedback">Debe tener al menos 3 caracteres.</div>
        <div class="valid-feedback">Nombre válido ✨</div>
      </div>

      <!-- USUARIO -->
      <div class="mb-3">
        <label class="form-label">Nombre de usuario</label>
        <input type="text" id="mod-usuario" class="form-control">
        <div class="invalid-feedback">Debe tener al menos 3 caracteres.</div>
        <div class="valid-feedback">Usuario válido ✨</div>
      </div>

      <!-- CORREO -->
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" id="mod-correo" class="form-control">
        <div class="invalid-feedback">Correo inválido.</div>
        <div class="valid-feedback">Correo válido ✨</div>
      </div>

      <!-- DIRECCIÓN -->
      <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input type="text" id="mod-direccion" class="form-control">
        <div class="invalid-feedback">Dirección inválida.</div>
        <div class="valid-feedback">Dirección válida ✨</div>
      </div>

      <!-- BOTONES -->
      <div class="d-flex gap-3 mt-4">
        <button type="submit" class="boton-animado w-50">
          Guardar cambios 💾
        </button>

        <a href="mi-perfil.html" class="boton-animado w-50 text-center">
          Volver ↩️
        </a>
      </div>

      <p id="mensaje-modificar" class="mt-3 fw-bold text-center"></p>

    </form>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- app.js primero -->
  <script src="../assets/js/app.js"></script>

  <!-- modificar_perfil.js  -->
  <script src="../assets/js/modificar-perfil.js"></script>

</body>
</html>
