<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil - Boleham & Co</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="../assets/css/estilo.css">
</head>

<body>

  <!-- HEADER -->
  <header id="header-principal">
    <div class="header-contenedor">

      <a href="../index.html">
        <img src="../assets/img/branding/boleham_co_logo.png" 
             alt="Boleham & Co" 
             class="logo-boleham-co">
      </a>

      <h1 class="titulo-principal">Mi perfil</h1>
    </div>
  </header>

  <!-- CONTENIDO -->
  <section class="container mt-5 mb-5">

    <div class="p-4 rounded shadow" style="background: var(--color-tarjeta);">

      <h2 class="text-center mb-4 titulo-articulo">Tu información personal ✨</h2>

      <!-- DATOS DEL USUARIO -->
      <div class="mb-3">
        <strong>Nombre completo:</strong>
        <p id="perfil-nombre" class="mb-2"></p>
      </div>

      <div class="mb-3">
        <strong>Nombre de usuario:</strong>
        <p id="perfil-usuario" class="mb-2"></p>
      </div>

      <div class="mb-3">
        <strong>Correo electrónico:</strong>
        <p id="perfil-correo" class="mb-2"></p>
      </div>

      <div class="mb-3">
        <strong>Dirección:</strong>
        <p id="perfil-direccion" class="mb-2"></p>
      </div>

      <div class="mb-3">
        <strong>Rol asignado:</strong>
        <p id="perfil-rol" class="mb-2"></p>
      </div>

      <!-- BOTONES -->
      <div class="d-flex gap-3 mt-4">
        <a href="modificar-perfil.html" class="boton-animado w-50 text-center">
          Modificar perfil 🛠️
        </a>

        <button id="btn-cerrar-sesion" class="boton-animado w-50">
          Cerrar sesión 🚪
        </button>
      </div>

    </div>

  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- app.js primero -->
  <script src="../assets/js/app.js"></script>

  <!-- perfil.js se integra a app.js, debe ir segundo -->
  <script src="../assets/js/perfil.js"></script>

</body>
</html>
