<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Boleham & Co</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="../assets/css/estilo.css">
</head>

<body>

  <!-- HEADER -->
  <header id="header-principal">
    <div class="header-contenedor">

      <a href="../index.html">
        <img src="../assets/img/branding/boleham_co_logo.png" 
             alt="Boleham & Co" 
             class="logo-boleham-co">
      </a>

      <h1 class="titulo-principal">Iniciar sesión</h1>
    </div>
  </header>

  <!-- FORMULARIO LOGIN -->
  <section class="container mt-5 mb-5">
    <form id="form-login" 
          class="p-4 rounded shadow"
          style="background: var(--color-tarjeta);">

      <h2 class="text-center mb-4 titulo-articulo">Bienvenido de vuelta ✨</h2>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" id="correo-login" class="form-control" placeholder="correo@ejemplo.com">
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password-login" class="form-control" placeholder="Tu contraseña">
      </div>

      <!-- BOTONES -->
      <div class="d-flex gap-3 mt-4">
        <button type="submit" class="boton-animado w-50">
          Iniciar sesión ✨
        </button>

        <button type="reset" class="boton-animado w-50">
          Limpiar 🧹
        </button>
      </div>

      <p id="mensaje-login" class="mt-3 fw-bold text-center"></p>

      <p class="mt-4 text-center">
        ¿No tienes cuenta?
        <a href="registro.html" class="link-nav">Crea una aquí</a>
      </p>

    </form>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- VALIDACIONES EXTERNAS -->
  <script src="../assets/js/validaciones.js"></script>

</body>
</html>
