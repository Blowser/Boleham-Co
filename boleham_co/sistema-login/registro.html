<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Boleham & Co</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="../assets/css/estilo.css">
</head>

<body>

  <!-- HEADER -->
  <header id="header-principal">
    <div class="header-contenedor">
     <a href="../index.html">  
      <img src="../assets/img/branding/boleham_co_logo.png" 
        alt="Boleham & Co" 
        class="logo-boleham-co">
     </a>

        <h1 class="titulo-principal">Iniciar sesión</h1>
    </div>
  </header>

  <!-- FORMULARIO DE REGISTRO -->
  <section class="container mt-5 mb-5">
    <form id="form-registro" 
          class="p-4 rounded shadow"
          style="background: var(--color-tarjeta);">

      <h2 class="text-center mb-4 titulo-articulo">Únete a Boleham & Co ✨</h2>

      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input type="text" id="nombre" class="form-control" placeholder="Ej: Ignacio Pérez">
      </div>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com">
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="mb-3">
        <label class="form-label">Confirmar contraseña</label>
        <input type="password" id="password2" class="form-control" placeholder="Repite tu contraseña">
      </div>

    <div class="d-flex gap-3 mt-4">
    <button type="submit" class="boton-animado w-50">
        Registrarse ✨
    </button>

    <button type="reset" class="boton-animado w-50">
        Limpiar 🧹
    </button>
    </div>


      <p id="mensaje" class="mt-3 fw-bold text-center"></p>

      <p class="mt-4 text-center">
        ¿Ya tienes cuenta?
        <a href="login.html" class="link-nav">Inicia sesión aquí</a>
      </p>

    </form>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- VALIDACIONES BÁSICAS -->
  <script>
    document.getElementById("form-registro").addEventListener("submit", function(e) {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const pass = document.getElementById("password").value.trim();
      const pass2 = document.getElementById("password2").value.trim();
      const mensaje = document.getElementById("mensaje");

      if (nombre.length < 3) {
        mensaje.textContent = "⚠ El nombre es demasiado corto.";
        mensaje.style.color = "red";
        return;
      }

      if (!correo.includes("@") || !correo.includes(".")) {
        mensaje.textContent = "⚠ Ingresa un correo válido.";
        mensaje.style.color = "red";
        return;
      }

      if (pass.length < 6) {
        mensaje.textContent = "⚠ La contraseña debe tener al menos 6 caracteres.";
        mensaje.style.color = "red";
        return;
      }

      if (pass !== pass2) {
        mensaje.textContent = "⚠ Las contraseñas no coinciden.";
        mensaje.style.color = "red";
        return;
      }

      mensaje.textContent = "✔ Registro exitoso. Bienvenido a Boleham & Co ✨";
      mensaje.style.color = "green";
    });
  </script>

</body>
</html>
